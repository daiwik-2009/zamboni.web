<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZamboniAI - Premium AI Hockey Coaching & Skill Academy</title>
    <style>
        :root {
            --primary: #00d2ff;
            --primary-dark: #0072ff;
            --bg-dark: #060b11;
            --bg-card: #0f1922;
            --bg-accent: #162535;
            --text-light: #ffffff;
            --text-muted: #94a9be;
            --success: #00ff87;
            --error: #ff3366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- Header Navigation --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 5%;
            background: rgba(6, 11, 17, 0.95);
            backdrop-filter: blur(12px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid rgba(0, 210, 255, 0.15);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .logo-text {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--text-light);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo-text span {
            color: var(--primary);
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        nav a:hover, nav a.active {
            color: var(--primary);
        }

        /* --- Buttons --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.85rem 2rem;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            font-size: 0.9rem;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: #000000;
            border: none;
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 210, 255, 0.6);
        }

        .btn-secondary {
            border: 2px solid rgba(0, 210, 255, 0.4);
            color: var(--primary);
            background: rgba(0, 210, 255, 0.03);
        }

        .btn-secondary:hover {
            background: rgba(0, 210, 255, 0.1);
            border-color: var(--primary);
            color: var(--text-light);
        }

        /* --- Hero Section --- */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8rem 5% 4rem;
            background: 
                radial-gradient(circle at 75% 30%, rgba(0, 114, 255, 0.2), transparent 55%),
                radial-gradient(circle at 20% 70%, rgba(0, 210, 255, 0.08), transparent 45%),
                linear-gradient(180deg, rgba(6, 11, 17, 0.4) 0%, var(--bg-dark) 100%);
            gap: 4rem;
        }

        .hero-content {
            flex: 1.2;
            max-width: 650px;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.3);
            color: var(--primary);
            padding: 0.4rem 1rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 1.5rem;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1px;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .hero h1 span {
            background: linear-gradient(135deg, #ffffff 40%, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        .hero-actions {
            display: flex;
            gap: 1.25rem;
        }

        /* --- Phone Simulation Layout --- */
        .hero-interface {
            flex: 0.8;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-frame {
            width: 340px;
            height: 680px;
            background: #000000;
            border: 11px solid #1c2a38;
            border-radius: 36px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.8), 
                0 0 40px rgba(0, 210, 255, 0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .app-top-bar {
            background: var(--bg-card);
            padding: 1.25rem 1rem;
            text-align: center;
            border-bottom: 1px solid rgba(0, 210, 255, 0.15);
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .app-top-bar::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--success);
        }

        .chat-display {
            flex: 1;
            padding: 1.25rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: radial-gradient(transparent, rgba(0,0,0,0.4));
        }

        .chat-display::-webkit-scrollbar {
            width: 4px;
        }
        .chat-display::-webkit-scrollbar-thumb {
            background: rgba(0, 210, 255, 0.2);
            border-radius: 2px;
        }

        .bubble {
            padding: 0.85rem 1.1rem;
            border-radius: 12px;
            max-width: 88%;
            font-size: 0.88rem;
            line-height: 1.4;
            animation: bubblePop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .coach-bubble {
            background: var(--bg-card);
            color: var(--text-light);
            border-bottom-left-radius: 2px;
            align-self: flex-start;
            border-left: 3px solid var(--primary);
        }

        .user-bubble {
            background: var(--primary-dark);
            color: #ffffff;
            border-bottom-right-radius: 2px;
            align-self: flex-end;
        }

        .app-input-strip {
            padding: 1rem;
            background: var(--bg-card);
            border-top: 1px solid rgba(0, 210, 255, 0.15);
            display: flex;
            gap: 0.6rem;
        }

        .app-field {
            flex: 1;
            background: rgba(6, 11, 17, 0.6);
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 6px;
            padding: 0.65rem 1rem;
            color: #ffffff;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .app-field:focus {
            border-color: var(--primary);
        }

        .app-submit {
            background: var(--primary);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000000;
            transition: background 0.2s;
        }

        .app-submit:hover {
            background: #ffffff;
        }

        /* --- Section Configurations --- */
        section {
            padding: 7rem 5%;
            position: relative;
        }

        .section-header {
            text-align: center;
            max-width: 750px;
            margin: 0 auto 4.5rem;
        }

        .section-header h2 {
            font-size: 2.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            margin-bottom: 1rem;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1.15rem;
        }

        /* --- Grid System --- */
        .features-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;

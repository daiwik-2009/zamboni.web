<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZamboniAI - AI Hockey Coaching & Analytics</title>
    <style>
        :root {
            --bg-dark: #0a1118;
            --bg-card: #121e2a;
            --primary-neon: #00d2ff;
            --secondary-neon: #00ff87;
            --text-main: #ffffff;
            --text-muted: #8ba2b5;
            --border-glow: rgba(0, 210, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Tactical Ice Grid Overlay */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            pointer-events: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            background: rgba(10, 17, 24, 0.85);
            backdrop-filter: blur(12px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
            border: 1px solid rgba(0, 210, 255, 0.4);
            object-fit: cover;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #fff, var(--primary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo span {
            color: var(--primary-neon);
        }

        /* Hero Showcase Block with Panoramic Background */
        .hero {
            padding: 200px 8% 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            background: linear-gradient(180deg, rgba(10, 17, 24, 0.4) 0%, rgba(10, 17, 24, 0.95) 80%, var(--bg-dark) 100%), 
                        url('image_2QAPqy.png') no-repeat center center;
            background-size: cover;
            min-height: 90vh;
            justify-content: center;
            z-index: 2;
        }

        .hero-tag {
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid var(--primary-neon);
            color: var(--primary-neon);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 24px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
            backdrop-filter: blur(4px);
        }

        h1 {
            font-size: 3.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 20px;
            max-width: 900px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        }

        h1 span {
            background: linear-gradient(90deg, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1.35rem;
            color: #e2f0fc;
            max-width: 700px;
            margin-bottom: 40px;
            line-height: 1.6;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .btn-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-neon), #00a2cc);
            color: #000;
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.5);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 210, 255, 0.7);
        }

        .btn-secondary {
            background: rgba(10, 17, 24, 0.6);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
        }

        .btn-secondary:hover {
            border-color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
        }

        .features {
            padding: 40px 8% 100px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 40px 30px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-neon);
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary-neon);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-icon {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .card h3 {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .card p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
        }

        .cta-section {
            padding: 80px 8% 120px;
            text-align: center;
            background: linear-gradient(180deg, transparent, rgba(0, 210, 255, 0.02));
            position: relative;
            z-index: 2;
        }

        .cta-box {
            max-width: 800px;
            margin: 0 auto;
            background: linear-gradient(135deg, var(--bg-card) 0%, #0d1722 100%);
            border: 1px solid var(--border-glow);
            padding: 60px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cta-icon {
            width: 100px;
            height: 100px;
            border-radius: 22px;
            margin-bottom: 24px;
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.3);
            border: 1px solid rgba(0, 210, 255, 0.5);
            object-fit: cover;
        }

        .cta-box h2 {
            font-size: 2.5rem;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .cta-box p {
            color: var(--text-muted);
            margin-bottom: 32px;
            font-size: 18px;
            max-width: 550px;
        }

        footer {
            padding: 40px 8%;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            background: #060b10;
            position: relative;
            z-index: 2;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.4rem; }
            .cta-box h2 { font-size: 1.9rem; }
            .btn-container { flex-direction: column; width: 100%; }
            .btn { width: 100%; }
            .hero { background-position: 35% center; padding-top: 140px; }
        }
    </style>
</head>
<body>

    <div class="grid-overlay"></div>

    <header>
        <div class="brand-container">
            <img src="image_xO6kvm.png" alt="ZamboniAI App Icon" class="header-icon">
            <div class="logo">Zamboni<span>AI</span></div>
        </div>
        <a href="https://play.google.com/store/apps/details?id=com.zamboni.ai" target="_blank" class="btn btn-secondary" style="padding: 10px 20px; font-size: 14px;">Get App</a>
    </header>

    <section class="hero">
        <div class="hero-tag">AI Hockey Coaching</div>
        <h1>Elevate Your Game With <span>Data-Driven Analysis</span></h1>
        <p class="hero-subtitle">Step onto the ice with the ultimate AI training assistant. Maximize your skill development, optimize skating lines, and track real-time metrics seamlessly.</p>
        <div class="btn-container">
